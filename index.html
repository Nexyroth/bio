<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Phase 12 (Part 4): viewport-fit=cover is REQUIRED for
         env(safe-area-inset-*) to be non-zero on iOS (notch / Dynamic
         Island / home indicator). Without it every inset reads 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="DUALITY — Hai bản sắc. Một tâm trí. Trang cá nhân của Tô Hoài Bảo / NEXYROTH."
    />
    <title>DUALITY — BẢO / NEXYROTH</title>
    <!--
      Preload: apply the persisted identity before first paint so the
      page never flashes the wrong theme. Runs before React loads.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('duality-identity');
          var fromHash = window.location.hash.replace(/^#/, '').split('/')[0];
          var identity = fromHash === 'nexyroth' || fromHash === 'bao'
            ? fromHash
            : stored === 'nexyroth' || stored === 'bao'
              ? stored
              : 'bao';
          document.documentElement.setAttribute('data-identity', identity);
          document.documentElement.style.backgroundColor =
            identity === 'nexyroth' ? '#05070a' : '#faf6ee';
        } catch (e) {
          document.documentElement.setAttribute('data-identity', 'bao');
        }
      })();
    </script>
    <script type="module" crossorigin src="/bio/assets/index-CWQy5AMP.js"></script>
    <link rel="stylesheet" crossorigin href="/bio/assets/index-D39IdhBe.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
